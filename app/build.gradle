plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ollie.torch'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ollie.torch'
        minSdk 31
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    // Kept in the repo so any machine can build updates the phone will accept.
    signingConfigs {
        debug {
            storeFile rootProject.file('keystore/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
